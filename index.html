<!DOCTYPE html>
<html>
    <head>
        <title>Google - Clone</title>

        <!-- Google logo icon for browser -->
        <link rel="icon" href="https://img.icons8.com/?size=100&id=17949&format=png&color=000000" type="image/png">

        <link rel="stylesheet" href="style.css">

        <!-- Font -->
         <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    </head>
<!--    
   ^ PLANNING CRAZY ^

# Top NavBar
    # Left side
        # About
        # Store
    # Right side
        # Gmail
        # Images
        # Menu Icon
        # Sign in (With blue border)

# Main Screen
    # Logo
        # Google 
            # G,g = Blue
            # o,e = red
            # o   = orange
            # l   = green
    # Search Bar
        # + icon (Left)
        # Text input (Center)
        # Voice icon (right)
        # Scanner (right)
        # Ai mode (spl border)
            # Search Ai icon
            # Ai mode = text
    # Two button
        # Google Search
        # I'm Feeling Lucky

# Lower Nav Bar
    # India (Left)

# Footer Nav Bar
    # Left side
        # Advertising
        # Bussiness
        # How Search Works
    # Right side
        # Privacy
        # Terms
        # Settings

-->
<body>

<!-- Top Navbar -->
<div class="top-nav-bar">

    <!-- Left side -->
    <div class="top-nav-bar-left">
        <a href="https://about.google/?fg=1&utm_source=google-IN&utm_medium=referral&utm_campaign=hp-header">About</a>
        <a href="https://store.google.com/in/?utm_source=hp_header&utm_medium=google_ooo&utm_campaign=GS100042&hl=en-IN">Store</a>  
    </div>

    <!-- Right Side -->
     <div class="top-nav-bar-right">
        <a href="https://workspace.google.com/intl/en-US/gmail/">Gmail</a>
        <a href="https://www.google.com/imghp?hl=en&ogbl">Images</a>

        <!-- Menu Icon -->
        <div class="top-nav-bar-right-img">
        <img src="https://img.icons8.com/?size=100&id=100642&format=png&color=000000" alt="Menu Icon">
        </div>

        <!-- Sign Up Box -->
        <div class="sign-up">
            <img src="https://img.icons8.com/?size=100&id=15263&format=png&color=ffffff" alt="account">
            <p>Sign Up</p>  
        </div>
     </div>
</div>

<!-- Main Screen -->
<div class="main-screen">

    <!-- Logo Text -->
    <h1>
        <span id="blue">G</span>
        <span id="red">o</span>
        <span id="yellow">o</span>
        <span id="blue">g</span>
        <span id="green">l</span>
        <span id="red">e</span>
    </h1>

    <!-- Search Bar-->
    <div class="search-bar-box">
        <!-- Add icon -->
        <div class="search-bar-img-box">
            <img src="https://img.icons8.com/?size=100&id=98&format=png&color=000000" alt="add icon">
        </div>

        <!-- Search test input -->
        <input type="text" name="" id="" autofocus>

        <!-- Icons -->
        <div class="search-bar-img-box1">
            <img src="https://img.icons8.com/?size=100&id=M0nvDJhT5w5g&format=png&color=000000" alt="mirco phone">
        </div>
        <div class="search-bar-img-box1">
            <img src="https://img.icons8.com/?size=100&id=GyA495QxM8El&format=png&color=000000" alt="google lens">
        </div>

        <!-- Ai mode -->
        <div class="ai-mode">
            <img src="https://img.icons8.com/?size=100&id=ET5veKixlQKy&format=png&color=000000" alt="Ai search">
            <p>AI Mode</p>
        </div>
    </div>

    <!-- Two Buttons-->
     <div class="btn-main">
        <a href="">
            <div class="btn1">Google Seach</div>
        </a>
        <a href="">
            <div class="btn1">I'm Feeling Lucky</div>
        </a>
     </div>
</div>

<!-- Footer navbar -->
<div class="foot-nav-bar">
    <!-- Foot Navbar A -->
    <div class="foot-nav-bar-a">
        <p>India</p>
    </div>

    <hr id="foot-nav-bar-hr">
    
    <!-- Foot Navbar B -->
    <div class="foot-nav-bar-b">
        
        <!-- Left Side -->
         <div class="foot-nav-bar-b-left">
            <a href="https://business.google.com/in/google-ads/?subid=ww-ww-et-g-awa-a-g_hpafoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpafooter&fg=1">Advertising</a>
            <a href="https://business.google.com/in/business-profile/?subid=ww-ww-et-g-awa-a-g_hpbfoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpbfooter&fg=1">Bussiness</a>
            <a href="https://www.google.com/search/howsearchworks/?fg=1">How Search Works</a>
         </div>

        <!-- Right Side -->
         <div class="foot-nav-bar-b-right">
            <a href="https://policies.google.com/privacy?hl=en-IN&fg=1">Privacy</a>
            <a href="https://policies.google.com/terms?hl=en-IN&fg=1">Terms</a>
            <a href="">Settings</a>
         </div>
    </div>

</div>


</body>
</html>
