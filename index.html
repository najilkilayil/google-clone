<!DOCTYPE html>
<html>
    <head>
        <title>Google - Clone</title>

        <!-- Google logo icon for browser -->
        <link rel="icon" href="https://img.icons8.com/?size=100&id=17949&format=png&color=000000" type="image/png">

        <link rel="stylesheet" href="style.css">

        <!-- Font -->
         <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    </head>
<!--    
   ^ PLANNING CRAZY ^

# Top NavBar
    # Left side
        # About
        # Store
    # Right side
        # Gmail
        # Images
        # Menu Icon
        # Sign in (With blue border)

# Main Screen
    # Logo
        # Google 
            # G,g = Blue
            # o,e = red
            # o   = orange
            # l   = green
    # Search Bar
        # + icon (Left)
        # Text input (Center)
        # Voice icon (right)
        # Scanner (right)
        # Ai mode (spl border)
            # Search Ai icon
            # Ai mode = text
    # Two button
        # Google Search
        # I'm Feeling Lucky

# Lower Nav Bar
    # India (Left)

# Footer Nav Bar
    # Left side
        # Advertising
        # Bussiness
        # How Search Works
    # Right side
        # Privacy
        # Terms
        # Settings

-->
<body>

<!-- Top Navbar -->
<div class="top-nav-bar">

    <!-- Left side -->
    <div class="top-nav-bar-left">
        <a href="">About</a>
        <a href="">Store</a>  
    </div>

    <!-- Right Side -->
     <div class="top-nav-bar-right">
        <a href="">Gmail</a>
        <a href="">Images</a>

        <!-- Menu Icon -->
        <img src="https://img.icons8.com/?size=100&id=100642&format=png&color=000000" alt="Menu Icon">

        <!-- Sign Up Box -->
        <div class="sign-up">
            <img src="https://img.icons8.com/?size=100&id=15263&format=png&color=ffffff" alt="account">
            <p>Sign Up</p>  
        </div>
     </div>
</div>

<!-- Main Screen -->
<div class="main-screen">

    <!-- Logo Text -->
    <h1>
        <span id="blue">G</span>
        <span id="red">o</span>
        <span id="yellow">o</span>
        <span id="blue">g</span>
        <span id="green">l</span>
        <span id="red">e</span>
    </h1>

    <!-- Search Bar-->
    <div class="search-bar-box">
        <!-- Add icon -->
        <div class="search-bar-img-box">
            <img src="https://img.icons8.com/?size=100&id=98&format=png&color=000000" alt="add icon">
        </div>

        <!-- Search test input -->
        <input type="text" name="" id="" autofocus>

        <!-- Icons -->
        <div class="search-bar-img-box1">
            <img src="https://img.icons8.com/?size=100&id=M0nvDJhT5w5g&format=png&color=000000" alt="mirco phone">
        </div>
        <div class="search-bar-img-box1">
            <img src="https://img.icons8.com/?size=100&id=GyA495QxM8El&format=png&color=000000" alt="google lens">
        </div>

        <!-- Ai mode -->
        <div class="ai-mode">
            <img src="https://img.icons8.com/?size=100&id=ET5veKixlQKy&format=png&color=000000" alt="Ai search">
            <p>AI Mode</p>
        </div>
    </div>
</div>

</body>
</html>
